<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">LaunchGuard product launch review workflow</title>
  <desc id="desc">An eight-step workflow moves from validated SKU data through pricing, policy retrieval, listing preparation, compliance review, human approval, and Shopify draft delivery. Compliance and human review have explicit stop paths.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071525"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132D49"/>
      <stop offset="1" stop-color="#172543"/>
    </linearGradient>
    <linearGradient id="review-card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2B2C62"/>
      <stop offset="1" stop-color="#243954"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#54D8E5"/>
    </marker>
    <marker id="stop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#F08A96"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 750; letter-spacing: 2.4px; fill: #62DFEA; }
      .heading { font-size: 36px; font-weight: 760; fill: #F7FAFF; }
      .lead { font-size: 18px; font-weight: 450; fill: #B6C5D8; }
      .phase { font-size: 12px; font-weight: 750; letter-spacing: 1.4px; fill: #83E5EE; }
      .card-title { font-size: 22px; font-weight: 720; fill: #F8FAFF; }
      .card-copy { font-size: 15.5px; font-weight: 450; fill: #B7C6D8; }
      .number { font-size: 13px; font-weight: 800; fill: #071525; }
      .branch { font-size: 13px; font-weight: 750; letter-spacing: 1px; }
      .rail-title { font-size: 18px; font-weight: 720; fill: #F3F7FC; }
      .rail-copy { font-size: 15px; font-weight: 450; fill: #AFC0D3; }
    </style>
  </defs>

  <rect width="1500" height="820" rx="28" fill="url(#background)"/>
  <circle cx="1435" cy="0" r="250" fill="#6B5BE7" opacity="0.08"/>
  <circle cx="20" cy="820" r="260" fill="#31C9D8" opacity="0.06"/>

  <text x="70" y="54" class="eyebrow">WORKFLOW MAP</text>
  <text x="70" y="101" class="heading">From SKU data to a reviewed Shopify draft</text>
  <text x="70" y="136" class="lead">Pricing and policy checks run before the workflow pauses for a named reviewer.</text>

  <g fill="none" stroke="#54D8E5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M380 252H420"/>
    <path d="M730 252H770"/>
    <path d="M1080 252H1120"/>
    <path d="M1275 325V410"/>
    <path d="M1120 482H1080"/>
    <path d="M770 482H730"/>
    <path d="M420 482H380"/>
  </g>

  <g>
    <rect x="70" y="180" width="310" height="145" rx="18" fill="url(#card)" stroke="#315775" stroke-width="1.5"/>
    <circle cx="101" cy="211" r="16" fill="#54D8E5"/>
    <text x="101" y="216" text-anchor="middle" class="number">1</text>
    <text x="350" y="215" text-anchor="end" class="phase">INPUT</text>
    <text x="95" y="255" class="card-title">Validate SKU data</text>
    <text x="95" y="285" class="card-copy">Product facts, costs, fees</text>
    <text x="95" y="308" class="card-copy">and source reference</text>

    <rect x="420" y="180" width="310" height="145" rx="18" fill="url(#card)" stroke="#315775" stroke-width="1.5"/>
    <circle cx="451" cy="211" r="16" fill="#54D8E5"/>
    <text x="451" y="216" text-anchor="middle" class="number">2</text>
    <text x="700" y="215" text-anchor="end" class="phase">RATE</text>
    <text x="445" y="255" class="card-title">Resolve FX</text>
    <text x="445" y="285" class="card-copy">Live rate or dated fallback</text>
    <text x="445" y="308" class="card-copy">with provider and timestamp</text>

    <rect x="770" y="180" width="310" height="145" rx="18" fill="url(#card)" stroke="#315775" stroke-width="1.5"/>
    <circle cx="801" cy="211" r="16" fill="#54D8E5"/>
    <text x="801" y="216" text-anchor="middle" class="number">3</text>
    <text x="1050" y="215" text-anchor="end" class="phase">ECONOMICS</text>
    <text x="795" y="255" class="card-title">Calculate prices</text>
    <text x="795" y="285" class="card-copy">Contribution-margin floor</text>
    <text x="795" y="308" class="card-copy">plus four stress scenarios</text>

    <rect x="1120" y="180" width="310" height="145" rx="18" fill="url(#card)" stroke="#315775" stroke-width="1.5"/>
    <circle cx="1151" cy="211" r="16" fill="#54D8E5"/>
    <text x="1151" y="216" text-anchor="middle" class="number">4</text>
    <text x="1400" y="215" text-anchor="end" class="phase">RULES</text>
    <text x="1145" y="255" class="card-title">Retrieve policies</text>
    <text x="1145" y="285" class="card-copy">Market and effective-date filters</text>
    <text x="1145" y="308" class="card-copy">with versioned citations</text>

    <rect x="1120" y="410" width="310" height="145" rx="18" fill="url(#card)" stroke="#315775" stroke-width="1.5"/>
    <circle cx="1151" cy="441" r="16" fill="#9D8CFF"/>
    <text x="1151" y="446" text-anchor="middle" class="number">5</text>
    <text x="1400" y="445" text-anchor="end" class="phase">CONTENT</text>
    <text x="1145" y="485" class="card-title">Build listing</text>
    <text x="1145" y="515" class="card-copy">Schema-valid title, copy and tags</text>
    <text x="1145" y="538" class="card-copy">limited to retrieved evidence</text>

    <rect x="770" y="410" width="310" height="145" rx="18" fill="url(#card)" stroke="#315775" stroke-width="1.5"/>
    <circle cx="801" cy="441" r="16" fill="#54D8E5"/>
    <text x="801" y="446" text-anchor="middle" class="number">6</text>
    <text x="1050" y="445" text-anchor="end" class="phase">CONTROL</text>
    <text x="795" y="485" class="card-title">Run compliance checks</text>
    <text x="795" y="515" class="card-copy">Claims, injection patterns</text>
    <text x="795" y="538" class="card-copy">and price-floor checks</text>

    <rect x="420" y="410" width="310" height="145" rx="18" fill="url(#review-card)" stroke="#8B7AEB" stroke-width="1.5"/>
    <circle cx="451" cy="441" r="16" fill="#9D8CFF"/>
    <text x="451" y="446" text-anchor="middle" class="number">7</text>
    <text x="700" y="445" text-anchor="end" class="phase">DECISION</text>
    <text x="445" y="485" class="card-title">Human review</text>
    <text x="445" y="515" class="card-copy">Inspect, edit, approve or reject</text>
    <text x="445" y="538" class="card-copy">from a durable checkpoint</text>

    <rect x="70" y="410" width="310" height="145" rx="18" fill="#103B40" stroke="#49D6B2" stroke-width="1.5"/>
    <circle cx="101" cy="441" r="16" fill="#49D6B2"/>
    <text x="101" y="446" text-anchor="middle" class="number">8</text>
    <text x="350" y="445" text-anchor="end" class="phase">DELIVERY</text>
    <text x="95" y="485" class="card-title">Create Shopify draft</text>
    <text x="95" y="515" class="card-copy">Remote lookup, delivery ledger</text>
    <text x="95" y="538" class="card-copy">and a recorded receipt</text>
  </g>

  <g fill="none" stroke="#F08A96" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#stop-arrow)">
    <path d="M925 555V612"/>
    <path d="M575 555V612"/>
  </g>
  <rect x="839" y="620" width="172" height="38" rx="19" fill="#48263B" stroke="#A65366"/>
  <text x="925" y="644" text-anchor="middle" class="branch" fill="#FFC2C9">BLOCKED BY CHECKS</text>
  <rect x="496" y="620" width="158" height="38" rx="19" fill="#48263B" stroke="#A65366"/>
  <text x="575" y="644" text-anchor="middle" class="branch" fill="#FFC2C9">REJECTED</text>
  <path d="M225 555V612" fill="none" stroke="#49D6B2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="145" y="620" width="160" height="38" rx="19" fill="#153F3D" stroke="#49D6B2"/>
  <text x="225" y="644" text-anchor="middle" class="branch" fill="#B9F5E4">DRAFT READY</text>

  <rect x="70" y="692" width="1360" height="86" rx="17" fill="#0A192A" stroke="#29455D"/>
  <text x="96" y="728" class="rail-title">Durable state and audit trail</text>
  <text x="96" y="756" class="rail-copy">SQLite checkpoints preserve graph position and pending approvals across restarts.</text>
  <line x1="750" y1="712" x2="750" y2="758" stroke="#2E4B63"/>
  <text x="780" y="728" class="rail-title">Operational ledger</text>
  <text x="780" y="756" class="rail-copy">Node timings, reviewer decisions, payload hashes and delivery receipts.</text>
</svg>
